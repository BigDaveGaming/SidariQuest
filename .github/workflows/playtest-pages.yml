name: Chapter 1 playtest
on:
  push:
    branches: [feature/chapter1-mobile-playtest]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp index.html chapter1.js progress.js manifest.json sw.js icon-*.png _site/
          cp -R assets _site/
          sed -i "s/playtest-v3/playtest-${GITHUB_SHA}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
