name: Generate Greek audio
# Press "Run workflow" in the Actions tab. Leave "Practice run" ticked first to see
# the lines and credits, then untick it to record. Only missing lines are recorded.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Practice run: list the lines and credits, spend nothing"
        type: boolean
        default: true
      sample:
        description: "Sample only: record the short list in directions.json to assets/audio/samples (game unchanged)"
        type: boolean
        default: false
      regenerate:
        description: "Lines to record again (exact Greek, one per line)"
        type: string
        required: false
        default: ""
      allow_non_greek:
        description: "Allow non-Greek voices (they read Greek with an accent)"
        type: boolean
        default: false
      branch:
        description: "Branch with the game"
        type: string
        default: feature/chapter1-mobile-playtest
permissions:
  contents: write
concurrency:
  group: generate-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make the recordings
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGENERATE: ${{ inputs.regenerate }}
          ALLOW_NON_GREEK: ${{ inputs.allow_non_greek }}
          SAMPLE: ${{ inputs.sample }}
        run: node scripts/generate-audio.mjs
      - name: Save them to the repo
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/audio
          if git diff --cached --quiet; then echo "No new recordings."; exit 0; fi
          count=$(git diff --cached --name-only --diff-filter=A -- 'assets/audio/*.mp3' | wc -l)
          if [ "${{ inputs.sample }}" = "true" ]; then git commit -m "Add voice samples"; else git commit -m "Add Greek audio ($count new recordings)"; fi
          git push origin HEAD:${{ inputs.branch }}
