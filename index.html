<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sidari Quest</title>
<meta name="theme-color" content="#027dfb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sidari Quest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--blue:#1F5FA8;--deep:#123e75;--sky:#027dfb;--sand:#E8B04A;--sun:#F07A3A;--olive:#7A8B3C;--pink:#D9387A;--paper:#f6ead0;--ink:#1b2333;--good:#2e9e4f;--bad:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b2447;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
.screen{position:fixed;inset:0;margin:0 auto;max-width:520px;display:none;overflow:hidden}
.screen.on{display:block}

/* ---------- TITLE ---------- */
#title{background:linear-gradient(#0270f0,#2893fc 60%)}
#title .frame{position:absolute;left:0;right:0;bottom:0;aspect-ratio:2/3;background:url(assets/title_bg.webp) center bottom/cover no-repeat}
#title .logo{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);width:min(72%,380px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
#title .tagline{position:absolute;left:4%;bottom:3%;width:44%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));transform:rotate(-4deg);animation:pop .5s .5s both}
.sign{position:absolute;left:84.1%;top:36.8%;width:14.6%;height:6.2%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;line-height:1.05;font-size:clamp(9px,2.6vw,13px);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.sign small{font-size:.75em;font-weight:700;opacity:.9}
.menu{position:absolute;right:4%;bottom:5%;width:46%;display:flex;flex-direction:column;gap:10px}
.btn{border:3px solid var(--deep);border-radius:16px;padding:12px 10px;font-weight:800;font-size:18px;background:var(--paper);color:var(--deep);box-shadow:0 4px 0 var(--deep),0 8px 14px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.play{background:linear-gradient(#ffd84a,#f5b81c);font-size:24px}
.btn.small{font-size:15px;padding:9px}
@keyframes drop{from{transform:translate(-50%,-140%)}}
@keyframes pop{from{transform:scale(0) rotate(-4deg)}}

/* ---------- SELECT ---------- */
#select{background:linear-gradient(#2893fc,#bfe3ff 55%,#f3d9a4)}
#select h1{margin:calc(env(safe-area-inset-top) + 18px) 0 4px;text-align:center;color:#fff;font-size:26px;text-shadow:0 3px 0 var(--deep)}
#select p.sub{margin:0 16px;text-align:center;color:var(--deep);font-weight:700;font-size:14px}
.cards{display:flex;gap:10px;padding:14px 12px;height:calc(100% - 210px)}
.card{flex:1;border:4px solid #fff;border-radius:20px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;position:relative;transition:transform .15s,border-color .15s,background .15s}
.card img{max-width:100%;max-height:78%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.card .nm{font-weight:900;font-size:19px;color:var(--deep);margin-top:6px}
.card .gr{font-size:12px;font-weight:700;color:#334}
.card.sel{border-color:var(--sand);background:rgba(255,236,170,.7);transform:scale(1.03)}

/* ---------- LESSON ---------- */
#lesson{display:none;flex-direction:column;background:#000}
#lesson.on{display:flex}
.top{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.x{border:0;background:rgba(255,255,255,.85);border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:900;color:var(--deep)}
.bar{flex:1;height:14px;border-radius:9px;background:rgba(255,255,255,.5);overflow:hidden;border:2px solid #fff}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd84a,#f07a3a);transition:width .4s}
.figs{background:rgba(255,255,255,.9);border-radius:14px;padding:4px 10px;font-weight:900;color:#6a2a6e;font-size:15px}
.scene{position:relative;flex:1;min-height:0;overflow:hidden}
.bg{position:absolute;inset:0}
.gsign{position:absolute;left:18%;right:18%;top:17%;padding:5px 6px;background:#fff;border:3px solid var(--blue);border-radius:6px;text-align:center;color:var(--blue);font-weight:900;font-size:clamp(12px,3.6vw,17px);letter-spacing:.5px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.player,.local{position:absolute;bottom:0;transition:transform .25s}
.player{left:-4%;width:60%;max-height:96%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 6px rgba(0,0,0,.3))}
.player.bump{animation:bump .35s}
.player.shake{animation:shake .4s}
@keyframes bump{50%{transform:translateY(-12px) scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.local{right:3%;width:38%;bottom:6%;display:flex;flex-direction:column;align-items:center}
.local .tag{margin-top:6px;background:var(--deep);color:#fff;font-weight:800;font-size:12px;padding:3px 9px;border-radius:10px;white-space:nowrap}

.panel{position:relative;z-index:4;background:var(--paper);border-top:4px solid var(--deep);border-radius:20px 20px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);max-height:62%;overflow-y:auto;box-shadow:0 -6px 16px rgba(0,0,0,.35)}
.who{display:inline-block;background:var(--blue);color:#fff;font-weight:800;font-size:12px;padding:2px 10px;border-radius:10px;margin-bottom:6px}
.who.me{background:var(--sun)}
.who.narr{background:#777}
.line{font-size:17px;line-height:1.35}
.line.narr{font-style:italic;color:#444}
.greek{display:flex;align-items:center;gap:10px}
.greek .g{font-size:23px;font-weight:800;color:var(--deep);line-height:1.25}
.tr{font-size:13px;color:#7a6a50;font-style:italic;margin-top:2px}
.say{flex:none;border:0;background:var(--blue);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;box-shadow:0 3px 0 var(--deep)}
.say:active{transform:translateY(2px);box-shadow:none}
.en{margin-top:6px;font-size:14px;color:#555}
.reveal{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:4px 0;text-decoration:underline}
.prompt{font-weight:800;margin:10px 0 8px;font-size:15px;color:#3b2f1a}
.bigsign{margin:4px auto 10px;max-width:92%;background:#fff;border:4px solid var(--blue);border-radius:8px;padding:10px;text-align:center;color:var(--blue);font-weight:900;font-size:22px;letter-spacing:1px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:3px solid #cdbb94;border-radius:14px;background:#fff;padding:10px 12px;font-size:17px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 #cdbb94}
.opt .s{display:block;font-size:12px;font-weight:600;color:#8a7a5c;font-style:italic}
.opt.right{border-color:var(--good);background:#e5f6e9;box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:#fbe6e6;box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4}
.fb.good{background:#e5f6e9;border:2px solid var(--good)}
.fb.bad{background:#fbe6e6;border:2px solid var(--bad)}
.fb b{display:block;font-size:16px;margin-bottom:2px}
.next{margin-top:10px;width:100%}
.tiles,.answer{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.answer{border-bottom:3px dashed #cdbb94;padding:6px 0 10px;margin-bottom:10px}
.tile{border:3px solid #cdbb94;background:#fff;border-radius:12px;padding:7px 12px;font-size:18px;font-weight:800;color:var(--deep);box-shadow:0 3px 0 #cdbb94}
.tile.used{visibility:hidden}

/* ---------- END ---------- */
#end{background:linear-gradient(#2893fc,#ffe2a8);overflow-y:auto}
#end .wrap{padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
#end h1{color:#fff;text-shadow:0 3px 0 var(--deep);margin:6px 0}
#end .face{width:58%;max-width:260px}
.score{font-size:18px;font-weight:800;color:var(--deep);margin:6px 0 14px}
.learned{text-align:left;background:var(--paper);border:3px solid var(--deep);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.learned h3{margin:2px 0 8px;color:var(--deep)}
.lr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #e3d5b5}
.lr:first-of-type{border-top:0}
.lr .t{flex:1}
.lr .g{font-weight:800;color:var(--deep)}
.lr .e{font-size:13px;color:#666}
.lr .say{width:34px;height:34px;font-size:15px}
.soonbox{background:rgba(255,255,255,.7);border-radius:14px;padding:10px;font-weight:700;color:var(--deep);margin-bottom:14px}

/* ---------- SETTINGS ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--paper);border:4px solid var(--deep);border-radius:20px;padding:16px;width:min(88%,380px)}
.sheet h2{margin:0 0 10px;color:var(--deep)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #e3d5b5;font-weight:700}
.row:first-of-type{border-top:0}
.tog{width:52px;height:30px;border-radius:15px;border:0;background:#bbb;position:relative}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--good)}
.tog.on::after{left:25px}
.note{font-size:12px;color:#7a6a50;margin-top:8px}
[hidden]{display:none!important}
#title .menu{bottom:max(5%,calc(env(safe-area-inset-bottom) + 12px))}
#title .tagline{bottom:max(3%,env(safe-area-inset-bottom))}
#select{overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
#select .go{display:block;margin:14px auto 0;width:70%}
#select .go:active{transform:translateY(3px)}
#lesson{background:#123e75}
.top,.panel,.wrap,.sheet{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.bg{background:linear-gradient(#2893fc,#bfe3ff 60%,#e8c68a);background-size:cover;background-position:center 44%}
.gsign{top:8px;left:7%;right:7%;font-size:clamp(12px,3.4vw,16px)}
.player{left:0;width:55%;max-height:83%}
.local{bottom:8px;max-height:82%;justify-content:flex-end}
.local img{max-width:100%;min-height:0;object-fit:contain}
.local .tag{white-space:normal;text-align:center}
.panel{max-height:68%;flex-shrink:0;overscroll-behavior:contain;scroll-padding:8px}
.opt,.btn,.tile,.say,.lr .say,.tog,.x,.reveal{min-height:44px}
.say,.lr .say,.x{min-width:44px}
.say:disabled{opacity:.45}
.figs img{width:20px;height:20px;vertical-align:middle;margin-right:5px}
.tog{min-height:44px;background:linear-gradient(transparent 7px,#bbb 7px,#bbb 37px,transparent 37px);flex:none}
.tog.on{background:linear-gradient(transparent 7px,var(--good) 7px,var(--good) 37px,transparent 37px)}
.tog::after{top:10px}
#book{background:linear-gradient(#2893fc,#ffe2a8);overflow-y:auto}
#book .wrap{padding-top:calc(env(safe-area-inset-top) + 20px);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
#book h1{color:white;text-shadow:0 3px 0 var(--deep)}
@media (max-height:590px){
  #title .logo{width:min(49%,240px)}
  #title .menu{gap:5px}
  #title .btn.play{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- TITLE -->
<section id="title" class="screen on">
  <div class="frame">
    <div class="sign">Σιδάρι<small>Sidari</small></div>
    <img class="tagline" src="assets/tagline.webp" alt="Learn Greek. Cause Chaos.">
    <div class="menu">
      <button class="btn play" id="bPlay">▶ Play</button>
      <button class="btn small" id="bBook">Phrasebook</button>
      <button class="btn small" id="bSettings">⚙ Settings</button>
    </div>
  </div>
  <img class="logo" src="assets/logo.webp" alt="Big Dave &amp; Gobby Sharon's Sidari Quest">
</section>

<!-- CHARACTER SELECT -->
<section id="select" class="screen">
  <h1>Who are you playing as?</h1>
  <p class="sub">This decides whether you learn the man's or woman's form of Greek words.</p>
  <div class="cards">
    <button class="card" data-c="m"><img src="assets/dave_full.webp" alt=""><div class="nm">Big Dave</div><div class="gr" lang="el">είμαι έτοιμος</div></button>
    <button class="card" data-c="f"><img src="assets/sharon_full.webp" alt=""><div class="nm">Gobby Sharon</div><div class="gr" lang="el">είμαι έτοιμη</div></button>
  </div>
  <button class="btn play go" id="bGo" disabled style="opacity:.5">Let's go!</button>
</section>

<!-- LESSON -->
<section id="lesson" class="screen">
  <div class="top">
    <button class="x" id="bQuit" aria-label="Save and return to title">✕</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="figs" id="figs">🟣 0</div>
  </div>
  <div class="scene" id="scene">
    <div class="bg vanhire">
    </div>
    <div class="gsign" id="sceneSign"></div>
    <img class="player" id="player" alt="">
    <div class="local" id="local">
      <img id="localPortrait" alt="" hidden>
      <div class="tag" id="localName"></div>
    </div>
  </div>
  <div class="panel" id="panel" tabindex="-1"></div>
</section>

<!-- END -->
<section id="book" class="screen"><div class="wrap" id="bookWrap"></div></section>
<section id="end" class="screen"><div class="wrap" id="endWrap"></div></section>

<!-- SETTINGS -->
<div class="modal" id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <div class="row">Show Latin letters under Greek <button class="tog" id="tTr" aria-label="Show pronunciation"></button></div>
    <div class="row">Show English dialogue <button class="tog" id="tEnglish" aria-label="Show English dialogue"></button></div>
    <div class="row">Slow Greek audio <button class="tog" id="tSlow" aria-label="Slow Greek audio"></button></div>
    <div class="row">Change character <button class="btn small" id="bChange">Change</button></div>
    <p class="note" id="voiceNote"></p>
    <button class="btn next" id="bClose">Done</button>
  </div>
</div>

<script src="assets/chapter1-art.js"></script>
<script src="chapter1.js"></script>
<script src="progress.js"></script>
<script>
"use strict";
const S = loadProgress({getItem: key => localStorage.getItem(key)});
function save(){try{localStorage.setItem(SAVE_KEY, JSON.stringify(S))}catch{}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const G=x=>x&&typeof x==="object"&&("m" in x)?x[S.c||"m"]:x;
const NAME=()=>S.c==="f"?"Sharon":"Dave";
const fill=s=>String(G(s)).replace(/\{P\}/g,NAME()).replace(/\{PG\}/g,S.c==="f"?"Σάρον":"Ντέιβ");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function show(id){
  if(id==="title") $("#bPlay").textContent = S.c && S.runs[`${CHAPTER.id}-${S.c}`] ? "Continue Adventure" : S.completedLessons.includes(CHAPTER.id) ? "Replay Chapter 1" : "▶ Play";
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
}

/* ---------- Greek transliteration ---------- */
function translit(str){
  const n=str.normalize("NFD");const L=[];
  for(const ch of n){
    if(ch==="́"){if(L.length)L[L.length-1].acc=true;continue}
    if(ch==="̈"){if(L.length)L[L.length-1].dia=true;continue}
    L.push({c:ch,acc:false,dia:false,up:ch!==ch.toLowerCase()});
  }
  const low=c=>c.toLowerCase().replace("ς","σ");
  const voiceless="θκξπστφχψ";
  const one={α:"a",β:"v",γ:"gh",δ:"dh",ε:"e",ζ:"z",η:"i",θ:"th",ι:"i",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"x",ο:"o",π:"p",ρ:"r",σ:"s",τ:"t",υ:"i",φ:"f",χ:"kh",ψ:"ps",ω:"o"};
  const ac={a:"á",e:"é",i:"í",o:"ó",u:"ú"};
  const accent=(s,last)=>{if(last){const i=s.search(/[aeiou](?!.*[aeiou])/);return i<0?s:s.slice(0,i)+ac[s[i]]+s.slice(i+1)}const i=s.search(/[aeiou]/);return i<0?s:s.slice(0,i)+ac[s[i]]+s.slice(i+1)};
  let out="",i=0,startWord=true;
  while(i<L.length){
    const a=L[i],b=L[i+1],ca=low(a.c),cb=b?low(b.c):"";let s=null,adv=1,acc=a.acc,last=false;
    if(!/[α-ω]/.test(ca)){out+=a.c;i++;startWord=true;continue}
    const di=b&&!b.dia&&!a.acc;
    if(di&&ca==="ο"&&cb==="υ"){s="ou";adv=2;acc=a.acc||b.acc;last=true}
    else if(di&&ca==="α"&&cb==="ι"){s="e";adv=2;acc=a.acc||b.acc}
    else if(di&&(ca==="ε"||ca==="ο"||ca==="υ")&&cb==="ι"){s="i";adv=2;acc=a.acc||b.acc}
    else if(di&&(ca==="α"||ca==="ε")&&cb==="υ"){const nx=L[i+2]?low(L[i+2].c):"";s=(ca==="α"?"a":"e")+((!nx||!/[α-ω]/.test(nx)||voiceless.includes(nx))?"f":"v");adv=2;acc=a.acc||b.acc}
    else if(ca==="μ"&&cb==="π"){s=startWord?"b":"mb";adv=2}
    else if(ca==="ν"&&cb==="τ"){s=startWord?"d":"nd";adv=2}
    else if(ca==="γ"&&cb==="κ"){s=startWord?"g":"ng";adv=2}
    else if(ca==="γ"&&cb==="γ"){s="ng";adv=2}
    else if(ca==="γ"&&/[ειηυ]/.test(cb)){s="y"}
    else s=one[ca]||ca;
    if(acc)s=accent(s,last);
    if(a.up&&startWord)s=s[0].toUpperCase()+s.slice(1);
    out+=s;i+=adv;startWord=false;
  }
  return out;
}

/* ---------- speech ---------- */
let greekVoice=null;
function findVoice(){try{const v=speechSynthesis.getVoices();greekVoice=v.find(x=>/^el(?:-|$)/i.test(x.lang))||null}catch{}}
function syncAudioButton(button){
  const label=greekVoice ? "Hear Greek" : "Greek voice unavailable";
  button.setAttribute("aria-label",label);
  button.title=label;
  button.disabled=!greekVoice;
}
try{findVoice();speechSynthesis.addEventListener("voiceschanged",()=>{findVoice();document.querySelectorAll(".say").forEach(syncAudioButton)})}catch(e){}
function speak(t){
  findVoice();
  if(!greekVoice) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang="el-GR";u.voice=greekVoice;
    u.rate=S.slow?0.65:0.9;speechSynthesis.speak(u);
  }catch{}
}
function audioButton(gr){
  findVoice();
  const b=el("button","say","🔊");
  syncAudioButton(b);
  b.onclick=()=>speak(gr);
  return b;
}
function greekBlock(gr,big=true){
  const w=el("div");const row=el("div","greek");
  const g=el("div","g",gr);g.lang="el";if(!big)g.style.fontSize="19px";
  const b=audioButton(gr);
  row.append(g,b);w.append(row);
  if(S.tr)w.append(el("div","tr",translit(gr)));
  return w;
}

/* ---------- chapter presentation ---------- */
const SCENES={
  landing:{name:"Over Corfu", art:"intro_1_landing"},
  baggage:{name:"Baggage reclaim", art:"intro_2_baggage"},
  arrivals:{name:"ΑΦΙΞΕΙΣ · ΑΠΟΣΚΕΥΕΣ · ΕΞΟΔΟΣ", art:"intro_3_arrivals"},
  van:{name:"ΕΝΟΙΚΙΑΣΕΙΣ ΑΥΤΟΚΙΝΗΤΩΝ", art:"bg_van_hire", local:"Spyros Rent-a-Van"},
  apartment:{name:"The apartment · Sidari", art:"bg_apartment_outside", local:"Kyria Eleni"},
  kitchen:{name:"The kitchen", art:"bg_apartment_kitchen", local:"Kyria Eleni"},
  market:{name:"The mini-market", art:"bg_minimarket", local:"Fat Spyros"}
};
const PORTRAITS={
  "Spyros Rent-a-Van":["spyros_van_normal","spyros_van_proud","spyros_van_confused"],
  "Kyria Eleni":["eleni_normal","eleni_pleased","eleni_exasperated"],
  "Kyrios Spyros":["kyrios_spyros_normal","kyrios_spyros_explaining","kyrios_spyros_stern"],
  "Fat Spyros":["fat_spyros_normal","fat_spyros_laughing","fat_spyros_fed_up"]
};
let run, runKey, idx, speaker;
const steps=CHAPTER.steps;
const qTotal=steps.filter(s=>s.t==="q"||s.t==="build").length;
const player=$("#player"), panel=$("#panel");
const portraitPath=f=>`assets/${S.c==="f"?"sharon":"dave"}_${f}.webp`;
function face(f,anim){
  player.src=portraitPath(f);
  if(anim){player.classList.remove("bump","shake");void player.offsetWidth;player.classList.add(anim)}
}
function artPath(name){return name && GAME_ART.includes(name) ? `assets/${name}.webp` : ""}
function mood(state=0){
  const src=artPath(PORTRAITS[speaker]?.[state]) || artPath(PORTRAITS[speaker]?.[0]);
  const portrait=$("#localPortrait");
  if(src) portrait.src=src;
  portrait.hidden=!src;
}
function startLesson(){
  runKey=`${CHAPTER.id}-${S.c}`;
  const saved=S.runs[runKey];
  run=saved && Number.isInteger(saved.idx) && steps[saved.idx] && saved.answers
    ? saved : {idx:0,answers:{}};
  S.runs[runKey]=run;
  idx=run.idx;
  save();
  show("lesson");
  render();
}
function updateTop(){
  $("#prog").style.width=(idx/steps.length*100)+"%";
  const figs=$("#figs"), icon=artPath("fig");
  figs.textContent=icon?String(S.figs):"🟣 "+S.figs;
  if(icon){const img=el("img");img.src=icon;img.alt="Figs";figs.prepend(img)}
}
function nextBtn(label="Continue"){
  const b=el("button","btn play next",label);
  b.onclick=()=>{
    b.disabled=true;
    idx++;
    if(idx===steps.length){finish();return}
    run.idx=idx;
    save();
    render();
    panel.focus({preventScroll:true});
  };
  return b;
}
function render(){
  const st=steps[idx];
  const sceneKey=steps.slice(0,idx+1).reverse().find(step=>step.scene).scene;
  const scene=SCENES[sceneKey];
  speaker=st.speaker||scene.local;
  const art=artPath(scene.art);
  $(".bg").style.backgroundImage=art ? `url("${art}")` : "";
  $("#scene").dataset.place=sceneKey;
  $("#sceneSign").textContent=scene.name;
  $("#localName").textContent=speaker||"";
  $("#local").hidden=!speaker;
  player.hidden=!!art&&!scene.local;
  mood();
  updateTop();
  panel.replaceChildren();
  panel.scrollTop=0;
  if(st.t==="narr"||st.t==="me"){
    face(st.face||"normal");
    panel.append(el("div","who",st.t==="me"?NAME():"Corfu"),el("div","line",fill(st.text)));
    if(st.scene==="arrivals")panel.append(el("div","en","Arrivals · Baggage · Exit"));
    panel.append(nextBtn());
    return;
  }
  if(st.t==="local"){
    face("normal");
    const en=el("div","en",S.english?st.en:"");
    const r=el("button","reveal","Show English");
    r.onclick=()=>{en.textContent=st.en;r.remove()};
    panel.append(el("div","who",speaker),greekBlock(st.gr));
    if(!S.english)panel.append(r);
    panel.append(en,nextBtn());
    return;
  }
  const result=run.answers[idx];
  if(result==="first"||result==="retried"){
    feedback(st,true);
    return;
  }
  face("normal");
  if(st.t==="build"){renderBuild(st);return}
  if(st.kind==="meaning"&&st.gr)panel.append(el("div","who",speaker),greekBlock(st.gr));
  if(st.kind==="sign")panel.append(el("div","bigsign",st.sign));
  panel.append(el("div","prompt",fill(st.prompt)));
  const box=el("div","opts");
  shuffle(st.opts).forEach(o=>{
    const b=el("button","opt");
    const gr=o.gr&&fill(o.gr);
    b.textContent=gr||fill(o.en);
    if(gr)b.lang="el";
    if(gr&&S.tr)b.append(el("span","s",translit(gr)));
    b.onclick=()=>{
      for(const choice of box.children)choice.disabled=true;
      b.classList.add(o.ok?"right":"wrong");
      if(gr)speak(gr);
      const wrong=st.opts.filter(option=>!option.ok).indexOf(o);
      feedback(st,!!o.ok,st.badOptions?.[wrong],wrong);
    };
    box.append(b);
  });
  panel.append(box);
}
function feedback(st,ok,joke,wrong=0){
  const previous=run.answers[idx];
  if(ok){
    if(previous!=="first"&&previous!=="retried")run.answers[idx]=previous==="missed"?"retried":"first";
    if(st.learn){
      const phrase=st.learn.map(fill);
      S.phrases[phrase[0]]=phrase[1];
    }
  }else{
    run.answers[idx]="missed";
  }
  save();
  face(ok?st.faceGood||"proud":wrong===1?"confused":"cringe",ok?"bump":"shake");
  mood(ok?1:2);
  const fb=el("div","fb "+(ok?"good":"bad"));
  fb.setAttribute("role","status");
  fb.append(el("b",null,fill(ok?st.good||"Σωστά! — Correct!":joke||st.bad||{
    m:"Spyros studies the jumble of words. Dave’s ready to draw him a van.",
    f:"Spyros reaches for a pen. Sharon catches herself about to spell VAN in English."
  })),document.createTextNode(fill(st.why)));
  panel.append(fb);
  if(ok){
    panel.append(nextBtn());
  }else{
    const retry=el("button","btn play next","Try again");
    retry.onclick=()=>{render();panel.querySelector("button")?.focus({preventScroll:true})};
    panel.append(retry);
  }
  fb.scrollIntoView({block:"nearest"});
}
function renderBuild(st){
  panel.append(el("div","prompt",fill(st.prompt)));
  const answer=el("div","answer"), tiles=el("div","tiles");
  const check=el("button","btn play next","Check");
  check.disabled=true;
  shuffle(st.answer.split(" ").concat(st.extra||[])).forEach(word=>{
    const tile=el("button","tile",word);
    tile.lang="el";
    tile.onclick=()=>{
      tile.classList.add("used");
      const picked=el("button","tile",word);
      picked.lang="el";
      picked.onclick=()=>{
        picked.remove();
        tile.classList.remove("used");
        check.disabled=!answer.children.length;
        tile.focus();
      };
      answer.append(picked);
      check.disabled=false;
    };
    tiles.append(tile);
  });
  check.onclick=()=>{
    const said=Array.from(answer.children,b=>b.textContent).join(" ");
    check.remove();
    for(const tile of [...tiles.children,...answer.children])tile.disabled=true;
    const ok=said===st.answer;
    if(ok)speak(said);
    feedback(st,ok);
  };
  panel.append(answer,tiles,check);
}
function phraseList(entries){
  const list=el("div","learned");
  list.append(el("h3",null,"Learned phrases"));
  if(!entries.length)list.append(el("p",null,"Choose the right Greek in the adventure to add your first phrase."));
  entries.forEach(([gr,en])=>{
    const row=el("div","lr"), text=el("div","t");
    const greek=el("div","g");greek.lang="el";greek.textContent=gr;
    const meaning=el("div","e");meaning.textContent=en;
    text.append(greek);
    if(S.tr){const reading=el("div","tr");reading.textContent=translit(gr);text.append(reading)}
    text.append(meaning);
    row.append(text,audioButton(gr));
    list.append(row);
  });
  return list;
}
function homeButton(){
  const b=el("button","btn next","Back to title");
  b.onclick=()=>show("title");
  return b;
}
function finish(){
  const score=Object.values(run.answers).filter(result=>result==="first").length;
  const earned=completeChapter(S,CHAPTER.id,run,step=>steps[step]?.legacyReward);
  delete S.runs[runKey];
  save();
  const w=$("#endWrap"), f=el("img","face");
  f.alt="";f.src=portraitPath("proud");
  w.replaceChildren(el("h1",null,"Chapter 1 complete"),f,
    el("div","line","Van parked. Shopping done. The buffet is officially self-service."),
    el("div","score",`${score} / ${qTotal} correct first try · +${earned} figs · ${S.figs} total`),
    phraseList(steps.flatMap(st=>st.learn?[st.learn.map(fill)]:[])));
  const again=el("button","btn play next","Replay Chapter 1");
  again.onclick=startLesson;
  w.append(again,homeButton());
  show("end");
}
$("#bBook").onclick=()=>{
  $("#bookWrap").replaceChildren(el("h1",null,"Phrasebook"),phraseList(Object.entries(S.phrases)),homeButton());
  show("book");
};

/* ---------- title / select / settings wiring ---------- */
$("#bPlay").onclick=()=>{S.c?startLesson():openSelect()};
function openSelect(){show("select");document.querySelectorAll(".card").forEach(c=>syncCard(c,c.dataset.c===S.c));updGo()}
function syncCard(card,selected){card.classList.toggle("sel",selected);card.setAttribute("aria-pressed",selected)}
function updGo(){const g=$("#bGo");g.disabled=!S.c;g.style.opacity=S.c?1:.5}
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{S.c=c.dataset.c;save();document.querySelectorAll(".card").forEach(x=>syncCard(x,x===c));updGo()});
$("#bGo").onclick=()=>{if(S.c)startLesson()};
$("#bQuit").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}$("#lesson").classList.remove("on");show("title")};
const toggles={tTr:"tr",tSlow:"slow",tEnglish:"english"};
function syncTogs(){
  Object.entries(toggles).forEach(([id,key])=>{
    const button=document.getElementById(id);
    button.classList.toggle("on",S[key]);
    button.setAttribute("aria-pressed",S[key]);
    button.onclick=()=>{S[key]=!S[key];save();syncTogs()};
  });
}
$("#bSettings").onclick=()=>{findVoice();$("#voiceNote").textContent=greekVoice?"Greek voice found ✓":"No Greek voice found on this device. On iPhone: Settings → Accessibility → Spoken Content → Voices → Greek.";syncTogs();$("#settings").classList.add("on")};
$("#bClose").onclick=()=>$("#settings").classList.remove("on");
$("#bChange").onclick=()=>{$("#settings").classList.remove("on");openSelect()};

show("title");

/* ---------- PWA ---------- */
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
